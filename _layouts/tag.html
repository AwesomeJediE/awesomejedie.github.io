---
layout: default
---
<ul>
	{% for post in site.tags[page.tag] %}
		{% if(page.tag("Art") %}
			<li><a href="{{  post.url }}" title="{{ post.title }}"><img src="/assets/img/painting.ico" title="{{ post.title }}" />{{ post.title }}</a></li>
		{% else %}
			<li><a href="{{  post.url }}" title="{{ post.title }}"><img src="/assets/img/file.ico" title="{{ post.title }}" />{{ post.title }}</a></li>
		{% endif %}
	{% endfor %}
</ul>
